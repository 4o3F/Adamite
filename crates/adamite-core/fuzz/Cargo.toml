[package]
name = "adamite-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
adamite-core = { path = ".." }
adamite-ntfs = { path = "../../adamite-ntfs" }
adamite-fixtures = { path = "../../adamite-fixtures" }

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[test]]
name = "harness"
path = "tests/harness.rs"
