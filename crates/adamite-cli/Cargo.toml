[package]
name = "adamite-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "adamite"
path = "src/main.rs"

[dependencies]
adamite-profile = { version = "0.1.0", path = "../adamite-profile" }
adamite-core = { version = "0.1.0", path = "../adamite-core" }
adamite-format = { version = "0.1.0", path = "../adamite-format" }
adamite-io = { version = "0.1.0", path = "../adamite-io" }
adamite-tui = { version = "0.1.0", path = "../adamite-tui" }
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
tracing.workspace = true

[dev-dependencies]
adamite-fixtures = { version = "0.1.0", path = "../adamite-fixtures" }

[lints]
workspace = true
