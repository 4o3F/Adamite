[package]
name = "adamite-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "adamite"
path = "src/main.rs"

[dependencies]
adamite-profile = { version = "0.1.0", path = "../adamite-profile" }
adamite-core = { version = "0.1.0", path = "../adamite-core" }
adamite-format = { version = "0.1.0", path = "../adamite-format" }
adamite-io = { version = "0.1.0", path = "../adamite-io" }
adamite-tui = { version = "0.1.0", path = "../adamite-tui" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tracing.workspace = true
parse-size = "1.1.0"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }

[dev-dependencies]
tempfile = "3"
adamite-fixtures = { version = "0.1.0", path = "../adamite-fixtures" }

[lints]
workspace = true
