[package]
name = "adamite-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "adamite"
path = "src/main.rs"

[dependencies]
adamite-core = { version = "0.1.0", path = "../adamite-core" }
adamite-io = { version = "0.1.0", path = "../adamite-io" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nt-time = { version = "0.15", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["formatting"] }
snafu.workspace = true

[dev-dependencies]
adamite-fixtures = { version = "0.1.0", path = "../adamite-fixtures" }

[lints]
workspace = true
