name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROPTEST_CASES: "1024"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo fmt --manifest-path crates/adamite-ntfs/fuzz/Cargo.toml --check
        if: runner.os == 'Linux'
      - run: cargo fmt --manifest-path crates/adamite-core/fuzz/Cargo.toml --check
        if: runner.os == 'Linux'
      - run: cargo clippy --manifest-path crates/adamite-ntfs/fuzz/Cargo.toml --all-targets --locked -- -D warnings
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg fuzzing
      - run: cargo clippy --manifest-path crates/adamite-core/fuzz/Cargo.toml --all-targets --locked -- -D warnings
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg fuzzing
      - run: cargo test --manifest-path crates/adamite-core/fuzz/Cargo.toml --test harness --locked
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: thumbv7em-none-eabihf
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p adamite-ntfs --target thumbv7em-none-eabihf

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"
          cache: true
      - run: deno fmt --check
      - run: deno lint
      - run: deno check scripts/
      - run: deno test --frozen --allow-read=scripts/fixtures/testdata scripts/fixtures/
      - run: deno test --frozen --allow-read=deno.json,.github/workflows/ci.yml,crates/adamite-ntfs/fuzz/Cargo.toml,crates/adamite-core/fuzz/Cargo.toml scripts/check_test.ts
      - run: deno task ci-lint

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: adamite-ntfs
            target: boot_sector
          - package: adamite-ntfs
            target: file_record
          - package: adamite-ntfs
            target: attributes
          - package: adamite-ntfs
            target: runlist
          - package: adamite-ntfs
            target: typed_values
          - package: adamite-core
            target: scan
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.package }}/fuzz
          cache-bin: true
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}/ -- -max_total_time=30 -max_len=262144 -timeout=2 -rss_limit_mb=2048
        working-directory: crates/${{ matrix.package }}
